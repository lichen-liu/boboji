name: Python tests

on:
  pull_request:
    branches: [main]
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    needs: [bobowatch_python, bobowatch_browser, flightrepo_python, flightrepo_browser]
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python has no Python 3.9 build for Ubuntu 26.04.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 6a70e6211b90369655016b21af5f3b652b19aa66
      - name: Verify exact migration candidate
        run: test "$(git rev-parse HEAD)" = "6a70e6211b90369655016b21af5f3b652b19aa66"

      - name: Require all project checks to pass
        if: ${{ needs.bobowatch_python.result != 'success' || needs.bobowatch_browser.result != 'success' || needs.flightrepo_python.result != 'success' || needs.flightrepo_browser.result != 'success' }}
        run: |
          echo "All BoboWatch and Flyji Python, package, JavaScript, and browser checks must succeed."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run pytest
        run: python -m pytest -q

  bobowatch_python:
    name: BoboWatch (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: projects/bobowatch
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 6a70e6211b90369655016b21af5f3b652b19aa66
      - name: Verify exact migration candidate
        run: test "$(git rev-parse HEAD)" = "6a70e6211b90369655016b21af5f3b652b19aa66"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            projects/bobowatch/requirements-core.txt
            projects/bobowatch/requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and check formatting
        run: |
          ruff check bobowatch tests examples installation deployment scripts
          ruff format --check bobowatch tests examples installation deployment scripts
      - name: Test Python
        run: python -Werror::ResourceWarning -m unittest discover -s tests -v
      - name: Test dashboard logic
        run: node --test tests/test_*.cjs
      - name: Build and verify the isolated adapter distributions
        run: |
          python scripts/build_adapter.py --output var/adapter
          python scripts/verify_adapter.py var/adapter/*.whl --sdist var/adapter/*.tar.gz

  bobowatch_browser:
    name: BoboWatch dashboard browsers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/bobowatch
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 6a70e6211b90369655016b21af5f3b652b19aa66
      - name: Verify exact migration candidate
        run: test "$(git rev-parse HEAD)" = "6a70e6211b90369655016b21af5f3b652b19aa66"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: projects/bobowatch/requirements-core.txt
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/bobowatch/tests/browser/package-lock.json
      - name: Install server and development-only browsers
        run: |
          python -m pip install -r requirements-core.txt
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Check chart interactions
        run: node tests/browser/charts.cjs
      - name: Check complete dashboard workflows
        run: python tests/browser/run.py

  flightrepo_python:
    name: Flyji (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/flightrepo
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 6a70e6211b90369655016b21af5f3b652b19aa66
      - name: Verify exact migration candidate
        run: test "$(git rev-parse HEAD)" = "6a70e6211b90369655016b21af5f3b652b19aa66"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: projects/flightrepo/pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run pytest
        run: python -m pytest -q

      - name: Check Python style
        run: |
          ruff check src tests scripts installation deployment
          ruff format --check src tests scripts installation deployment

      - name: Verify the installed package
        run: |
          python -m build --wheel --outdir var/wheels
          python scripts/verify_package.py var/wheels/*.whl

  flightrepo_browser:
    name: Flyji browser workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/flightrepo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 6a70e6211b90369655016b21af5f3b652b19aa66
      - name: Verify exact migration candidate
        run: test "$(git rev-parse HEAD)" = "6a70e6211b90369655016b21af5f3b652b19aa66"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run frontend unit tests
        run: node --test tests/test_frontend.mjs tests/test_journey_visuals.mjs tests/test_route_projection.mjs tests/test_workspace_state.mjs tests/test_journey_detail.mjs tests/test_format_cache.mjs
      - name: Install browser QA tools
        run: |
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Run browser checks against the demo
        env:
          NODE_PATH: tests/browser/node_modules
          FLYJI_QA_BROWSER: chromium
        run: |
          mkdir -p var
          python scripts/run_demo.py --port 8013 > var/demo-server.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8013/health/ready; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8013/health/ready; then
            cat var/demo-server.log
            exit 1
          fi
          node scripts/qa_web.cjs
          FLYJI_QA_BROWSER=webkit FLYJI_QA_OUTPUT=var/web-qa/webkit node scripts/qa_web.cjs
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: projects/flightrepo/var/web-qa/
          if-no-files-found: ignore
