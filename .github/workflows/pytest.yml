name: Python tests

on:
  pull_request:
    branches: [main]
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    needs: [bobowatch_python, bobowatch_browser]
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python has no Python 3.9 build for Ubuntu 26.04.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ebedbb5e68d58e5b8718dfb391fabebd321cd80d
      - name: Verify exact reconstruction candidate
        run: test "$(git rev-parse HEAD)" = "ebedbb5e68d58e5b8718dfb391fabebd321cd80d"

      - name: Require BoboWatch checks to pass
        if: ${{ needs.bobowatch_python.result != 'success' || needs.bobowatch_browser.result != 'success' }}
        run: |
          echo "BoboWatch Python, adapter, JavaScript, and browser checks must all succeed."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run pytest
        run: python -m pytest -q

  bobowatch_python:
    name: BoboWatch (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: projects/bobowatch
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ebedbb5e68d58e5b8718dfb391fabebd321cd80d
      - name: Verify exact reconstruction candidate
        run: test "$(git rev-parse HEAD)" = "ebedbb5e68d58e5b8718dfb391fabebd321cd80d"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            projects/bobowatch/requirements-core.txt
            projects/bobowatch/requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and check formatting
        run: |
          ruff check bobowatch tests examples installation deployment scripts
          ruff format --check bobowatch tests examples installation deployment scripts
      - name: Test Python
        run: python -Werror::ResourceWarning -m unittest discover -s tests -v
      - name: Test dashboard logic
        run: node --test tests/test_*.cjs
      - name: Build and verify the isolated adapter distributions
        run: |
          python scripts/build_adapter.py --output var/adapter
          python scripts/verify_adapter.py var/adapter/*.whl --sdist var/adapter/*.tar.gz

  bobowatch_browser:
    name: BoboWatch dashboard browsers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/bobowatch
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ebedbb5e68d58e5b8718dfb391fabebd321cd80d
      - name: Verify exact reconstruction candidate
        run: test "$(git rev-parse HEAD)" = "ebedbb5e68d58e5b8718dfb391fabebd321cd80d"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: projects/bobowatch/requirements-core.txt
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/bobowatch/tests/browser/package-lock.json
      - name: Install server and development-only browsers
        run: |
          python -m pip install -r requirements-core.txt
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Check chart interactions
        run: node tests/browser/charts.cjs
      - name: Check complete dashboard workflows
        run: python tests/browser/run.py
