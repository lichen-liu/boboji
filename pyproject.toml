[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boboji"
version = "0.1.0"
description = "Local tools for travel data, including Google Maps Timeline to Fog of World"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Boboji contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
timeline_to_fog = "boboji.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/boboji"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
